<div class="panel contenedor">
    <div class="title">
        <h3>Registro de Producto</h3>
    </div>
    <form>
        <div class="input-group">
            <label for="sku">SKU</label>
            <input type="text" id="sku" name="sku" placeholder="Ej:0001" required>
        </div>
        <div class="input-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej:Acetaminofen" required>
        </div>  
        <div class="input-group">
            <label for="precio">Precio blister</label>
            <input type="number" id="precio" name="precio" min="100" placeholder="Ej:4000" required>
        </div>  

        <div class="input-group">
            <label for="stock">Stock (Caja)</label>
            <input type="number" id="stock" name="stock" min="100" placeholder="Ej:30" required>
        </div>
        <div class="input-group">
            <label for="descripcion">Descripcion</label>
            <input type="text" id="descripcion" name="descripcion" min="100" placeholder="Ej:Analgésico y antipirético" required>
        </div>
        <div class="input-image">
            <label for="imagen">Subir Imagen</label>
            <input class="image-input" type="file" id="imagen" name="imagen" accept="image/*" required>
        </div>
        <button class="button" type="submit">
            <span>Guardar Producto</span>
        </button> 
    </form>
</div>
